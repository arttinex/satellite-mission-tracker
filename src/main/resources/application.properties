spring.application.name=satellite-mission-tracker

# MongoDB connection.
# Reads from the MONGODB_URI environment variable if set (used in Docker /
# CI / production), falling back to local MongoDB for plain `mvn spring-
# boot:run` on a dev machine. This keeps real credentials out of git -
# never hardcode a production connection string with embedded credentials
# here, since this file is committed to the repo.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/satellite_tracker}

# Render (and most container platforms) assign the port to listen on via
# the PORT env var at runtime; default to 8080 for local/dev runs where
# PORT isn't set.
server.port=${PORT:8080}

# Actuator / Micrometer - expose metrics endpoints so the layered
# metrics recorded in repository/service/controller can be inspected.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

logging.level.com.satellite.tracker=INFO